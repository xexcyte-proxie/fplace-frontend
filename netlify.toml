[build]
  command = "npm ci --prefix mappedin-pwa && npm run build --prefix mappedin-pwa"
  publish = "mappedin-pwa/dist"

[build.environment]
  VITE_WS_URL = "wss://api.fplaces.com"
  # Match the current local navigation setup without publishing local .env files.
  VITE_MAPPEDIN_MAP_ID = "6a870d6ee709ea000bec67d6"
  VITE_PHYSICAL_WALK_DEMO = "1"
  VITE_HIDE_PHYSICAL_WALK_CONTROLS = "1"
  VITE_ALLOW_REMOTE_AR = "1"
  VITE_ALLOW_REMOTE_POSTING = "1"
  VITE_ENABLE_VENUE_GEOLOCATION_SIMULATION = "1"
  VITE_AR_URL = "/ar/"
  VITE_API_URL = ""

# Fresh shell after every deploy (SPA routes + index.html + SW).
# Hashed /assets/* override below so bundles stay immutable.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Proxy API requests to the fPlaces backend (must be before SPA fallback).
[[redirects]]
  from = "/api/*"
  to = "http://fplaces-alb-1964416382.us-east-1.elb.amazonaws.com/api/:splat"
  status = 200
  force = true

# Password-reset email deep links → SPA (then opens Set new password).
[[redirects]]
  from = "/reset-password"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/reset-password/"
  to = "/index.html"
  status = 200
  force = false

# PWA SPA fallback - do not rewrite static assets (assets/, ar/, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# AR module deep links under /ar/
[[redirects]]
  from = "/ar/*"
  to = "/ar/index.html"
  status = 200
  force = false
