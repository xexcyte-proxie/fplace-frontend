[build]
  command = "npm ci --prefix mappedin-pwa && npm run build --prefix mappedin-pwa"
  publish = "mappedin-pwa/dist"

# Netlify cannot proxy WebSocket upgrades - connect the PWA directly to the backend WS host.
# ALB is HTTP-only today (ws://). HTTPS pages block mixed-content sockets until TLS is on the ALB.
[build.environment]
  VITE_WS_URL = "ws://fplaces-alb-1964416382.us-east-1.elb.amazonaws.com"

# Fresh shell after every deploy (SPA routes + index.html + SW).
# Hashed /assets/* override below so bundles stay immutable.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Proxy API requests to the fPlaces backend (must be before SPA fallback).
[[redirects]]
  from = "/api/*"
  to = "http://fplaces-alb-1964416382.us-east-1.elb.amazonaws.com/api/:splat"
  status = 200
  force = true

# Password-reset email deep links → SPA (then opens Set new password).
[[redirects]]
  from = "/reset-password"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/reset-password/"
  to = "/index.html"
  status = 200
  force = false

# PWA SPA fallback - do not rewrite static assets (assets/, ar/, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# AR module deep links under /ar/
[[redirects]]
  from = "/ar/*"
  to = "/ar/index.html"
  status = 200
  force = false
