[build]
  command = "npm ci --prefix mappedin-pwa && npm run build --prefix mappedin-pwa"
  publish = "mappedin-pwa/dist"

# Netlify cannot proxy WebSocket upgrades — connect the PWA directly to the backend WS host.
[build.environment]
  VITE_WS_URL = "wss://fplaces-backend.vercel.app"

# Fresh shell after every deploy (SPA routes + index.html + SW).
# Hashed /assets/* override below so bundles stay immutable.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Proxy API requests to the fPlaces backend (must be before SPA fallback).
[[redirects]]
  from = "/api/*"
  to = "https://fplaces-backend.vercel.app/api/:splat"
  status = 200
  force = true

# PWA SPA fallback — do not rewrite static assets (assets/, ar/, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# AR module deep links under /ar/
[[redirects]]
  from = "/ar/*"
  to = "/ar/index.html"
  status = 200
  force = false
