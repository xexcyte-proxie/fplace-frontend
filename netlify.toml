[build]
  command = "npm ci --prefix mappedin-pwa && npm run build --prefix mappedin-pwa"
  publish = "mappedin-pwa/dist"

# Fresh shell after every deploy (SPA routes + index.html + SW).
# Hashed /assets/* override below so bundles stay immutable.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Password-reset email deep links → SPA (then opens Set new password).
[[redirects]]
  from = "/reset-password"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/reset-password/"
  to = "/index.html"
  status = 200
  force = false

# PWA SPA fallback - do not rewrite static assets (assets/, ar/, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# AR module deep links under /ar/
[[redirects]]
  from = "/ar/*"
  to = "/ar/index.html"
  status = 200
  force = false
