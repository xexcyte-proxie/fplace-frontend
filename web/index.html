<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Indoor navigation — search, route, and guidance inside mapped venues.">
  <meta name="theme-color" content="#0F172A">
  <meta http-equiv="Permissions-Policy" content="geolocation=(self)">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Indoor Nav">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>Indoor Nav</title>
</head>
<body style="margin:0;background:#0F172A;color:#94a3b8;font-family:system-ui,sans-serif;">
  <div id="boot-splash" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:999999;pointer-events:none;">
    <div>
      <div style="width:36px;height:36px;border:3px solid #334155;border-top-color:#3b82f6;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px;"></div>
      <div style="color:#e2e8f0;font-size:16px;font-weight:600;">Indoor Nav</div>
      <div style="margin-top:8px;font-size:14px;">Loading app…</div>
    </div>
  </div>
  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  <script>
    (function () {
      function hideBootSplash() {
        var el = document.getElementById('boot-splash');
        if (el) el.remove();
      }
      window.addEventListener('flutter-first-frame', hideBootSplash);
      // Fallback if first-frame event is missed (common on mobile web-server).
      var observer = new MutationObserver(function () {
        if (
          document.querySelector('flt-glass-pane') ||
          document.querySelector('flutter-view') ||
          document.querySelector('canvas')
        ) {
          hideBootSplash();
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
      setTimeout(hideBootSplash, 120000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
