<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e07a33" />
    <meta name="description" content="Indoor navigation: search, route, and AR guidance inside mapped venues." />
    <meta http-equiv="Permissions-Policy" content="geolocation=(self), camera=(self), gyroscope=(self), accelerometer=(self), magnetometer=(self), xr-spatial-tracking=(self), bluetooth=(self)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="fplaces" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,700&display=swap"
      rel="stylesheet"
    />
    <title>fplaces</title>
    <style>
      html, body { margin: 0; height: 100%; background: #e07a33; }
      #splash-static {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #e07a33;
        text-align: center;
      }
      #splash-static .splash-title {
        margin: 0;
        font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
        font-size: 48px;
        font-weight: 700;
        letter-spacing: -1px;
        line-height: 1;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div id="splash-static" aria-hidden="true">
      <h1 class="splash-title">fplaces</h1>
    </div>
    <div id="app">
      <div id="mappedin-map"></div>
      <div id="ui-root"></div>
      <div id="ar-pip-shell" hidden>
        <iframe
          id="ar-frame"
          title="AR navigation"
          allow="camera; geolocation; gyroscope; accelerometer; magnetometer; xr-spatial-tracking; fullscreen"
        ></iframe>
        <div class="ar-pip-drag-layer" aria-hidden="true"></div>
        <div class="ar-pip-bar">
          <span class="ar-pip-label">Live View</span>
          <button type="button" id="ar-pip-expand" class="ar-pip-icon-btn" aria-label="Expand Live View">
            <span aria-hidden="true">⛶</span>
          </button>
          <button type="button" id="ar-pip-close" class="ar-pip-icon-btn" aria-label="Close Live View">
            <span aria-hidden="true">×</span>
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
