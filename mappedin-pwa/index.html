<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e07a33" />
    <meta name="description" content="Indoor navigation: search, route, and AR guidance inside mapped venues." />
    <meta http-equiv="Permissions-Policy" content="geolocation=(self), camera=(self), gyroscope=(self), accelerometer=(self), magnetometer=(self), xr-spatial-tracking=(self), bluetooth=(self)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="fplaces" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <link
      rel="preload"
      href="/fonts/source-serif-4-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>fplaces</title>
    <style>
      /* Local Source Serif so splash never paints as Times before the JS bundle. */
      @font-face {
        font-family: "Source Serif 4";
        font-style: normal;
        font-display: swap;
        font-weight: 200 900;
        src: url("/fonts/source-serif-4-latin-wght-normal.woff2")
          format("woff2-variations");
      }
      html, body { margin: 0; height: 100%; background: #e07a33; }
      #splash-static {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #e07a33;
        text-align: center;
      }
      #splash-static .splash-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 0 28px;
      }
      #splash-static .splash-title {
        margin: 0;
        font-family: "Source Serif 4", Georgia, ui-serif, serif;
        font-size: 48px;
        font-weight: 700;
        letter-spacing: -1px;
        line-height: 1;
        color: #fff;
      }
      #splash-static .splash-tagline {
        margin: 0;
        max-width: 16em;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.01em;
        line-height: 1.35;
        color: rgba(255, 255, 255, 0.92);
        opacity: 0;
        animation: splash-tagline-fade 1.1s ease 0.45s forwards;
      }
      @keyframes splash-tagline-fade {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash-static .splash-tagline {
          opacity: 1;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash-static" aria-hidden="true">
      <div class="splash-brand">
        <h1 class="splash-title">fplaces</h1>
        <p class="splash-tagline">Find People, Places. Find your way!</p>
      </div>
    </div>
    <div id="app">
      <div id="mappedin-map"></div>
      <div id="ui-root"></div>
      <div id="ar-pip-shell" hidden>
        <iframe
          id="ar-frame"
          title="AR navigation"
          allow="camera; geolocation; gyroscope; accelerometer; magnetometer; xr-spatial-tracking; fullscreen"
        ></iframe>
        <div class="ar-pip-drag-layer" aria-hidden="true"></div>
        <div class="ar-pip-bar">
          <span class="ar-pip-label">Live View</span>
          <button type="button" id="ar-pip-expand" class="ar-pip-icon-btn" aria-label="Expand Live View">
            <span aria-hidden="true">⛶</span>
          </button>
          <button type="button" id="ar-pip-close" class="ar-pip-icon-btn" aria-label="Close Live View">
            <span aria-hidden="true">×</span>
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
