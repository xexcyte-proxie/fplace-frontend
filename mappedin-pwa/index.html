<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#12121a" />
    <meta name="description" content="Indoor navigation: search, route, and AR guidance inside mapped venues." />
    <meta http-equiv="Permissions-Policy" content="geolocation=(self), camera=(self), gyroscope=(self), accelerometer=(self), magnetometer=(self), xr-spatial-tracking=(self), bluetooth=(self)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="fplaces" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <title>fplaces</title>
    <style>
      html, body { margin: 0; height: 100%; background: #12121a; }
      #splash-static {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #12121a;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        text-align: center;
      }
      #splash-static .splash-logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: #4264a8;
      }
      #splash-static .splash-title {
        margin: 20px 0 0;
        font-size: 28px;
        font-weight: 700;
        color: #fff;
      }
      #splash-static .splash-tagline {
        margin: 8px 0 0;
        font-size: 14px;
        color: #8e8e93;
      }
      #splash-static .splash-progress {
        width: min(240px, calc(100vw - 48px));
        height: 4px;
        margin-top: 32px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      #splash-static .splash-progress-bar {
        width: 35%;
        height: 100%;
        border-radius: inherit;
        background: #2e7d32;
      }
    </style>
  </head>
  <body>
    <div id="splash-static" aria-hidden="true">
      <div class="splash-logo"></div>
      <h1 class="splash-title">fplaces</h1>
      <p class="splash-tagline">Find places. Find people. Find your way.</p>
      <div class="splash-progress"><div class="splash-progress-bar"></div></div>
    </div>
    <div id="app">
      <div id="mappedin-map"></div>
      <div id="ui-root"></div>
      <div id="ar-pip-shell" hidden>
        <iframe
          id="ar-frame"
          title="AR navigation"
          allow="camera; geolocation; gyroscope; accelerometer; magnetometer; xr-spatial-tracking; fullscreen"
        ></iframe>
        <div class="ar-pip-drag-layer" aria-hidden="true"></div>
        <div class="ar-pip-bar">
          <span class="ar-pip-label">Live View</span>
          <button type="button" id="ar-pip-expand" class="ar-pip-icon-btn" aria-label="Expand Live View">
            <span aria-hidden="true">⛶</span>
          </button>
          <button type="button" id="ar-pip-close" class="ar-pip-icon-btn" aria-label="Close Live View">
            <span aria-hidden="true">×</span>
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
