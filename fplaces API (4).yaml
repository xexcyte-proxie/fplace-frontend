          type: integer
          readOnly: true
        location_id:
          type: string
          readOnly: true
        location_name:
          type: string
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/PublicUser'
          readOnly: true
        content:
          type: string
