          type: string
          description: Display name, must be unique.
          maxLength: 100
        location:
          type: string
          description: Free-text address/location.
          maxLength: 255
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
          description: Reserved for future GPS auto-suggest.
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
          description: Reserved for future GPS auto-suggest.
        mappedin_map_id:
          type: string
          nullable: true
          description: External key for Mappedin integration.
          maxLength: 255
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    VenueRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Display name, must be unique.
          maxLength: 100
        location:
          type: string
          description: Free-text address/location.
          maxLength: 255
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
          description: Reserved for future GPS auto-suggest.
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
          description: Reserved for future GPS auto-suggest.
        mappedin_map_id:
          type: string
          nullable: true
