          description: '`pseudo_name` if set, otherwise falls back to the email''s
            local part.'
      required:
      - display_name
      - id
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          description: Used as the login identifier. Must be unique.
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          description: Must pass Django's password validators (min length 8, not too
            common, not too similar to your email).
        password_confirm:
          type: string
          writeOnly: true
          minLength: 1
          description: Must exactly match `password`.
