      - access
      - expires_in
      - has_2d_trial_expired
      - has_tried_2d_view
      - has_tried_ar_view
      - mappedin
      - token_type
      - trial_expires_at
    GuestMappedInData:
      type: object
      properties:
        token:
          type: string
        expires_in:
          type: integer
      required:
      - expires_in
      - token
    GuestSessionResponse:
      type: object
      properties:
        has_tried_ar_view:
          type: boolean
        has_tried_2d_view:
          type: boolean
        has_2d_trial_expired:
          type: boolean
      required:
      - has_2d_trial_expired
      - has_tried_2d_view
      - has_tried_ar_view
