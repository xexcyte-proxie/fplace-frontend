        old_password:
          type: string
          writeOnly: true
          minLength: 1
          description: The account's current password, for re-authentication.
        new_password:
          type: string
          writeOnly: true
          minLength: 1
          description: Must pass Django's password validators.
      required:
      - new_password
      - old_password
    ChannelsEnum:
      enum:
