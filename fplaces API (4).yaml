        * `push` - Push
    Comment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        post:
          type: integer
          description: The post this comment replies to.
        user:
          allOf:
          - $ref: '#/components/schemas/PublicUser'
          readOnly: true
        content:
          type: string
          description: Comment text, max 500 characters.
          maxLength: 500
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content
      - created_at
      - id
      - post
      - updated_at
      - user
    CommentRequest:
      type: object
      properties:
        post:
          type: integer
