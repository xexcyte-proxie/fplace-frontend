      - name
    VenueStat:
      type: object
      properties:
        venue_name:
          type: string
        post_count:
          type: integer
      required:
      - post_count
      - venue_name
    VerbEnum:
      enum:
      - comment
      - upvote
      - moderation
      - broadcast
      type: string
      description: |-
        * `comment` - Comment
        * `upvote` - Upvote
        * `moderation` - Moderation
        * `broadcast` - Broadcast
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Auth
  description: Registration, login/refresh, email verification, password reset.
- name: Users
  description: Authenticated user's own profile.
- name: Categories
  description: Fixed set of post categories (Lines and Crowds, Food and Drinks, Fan
    Vibe, Help).
- name: Interests
  description: Curated catalog of user interests shown as profile picker tags.
- name: Venues
  description: Stadiums/arenas fans can select to join a live feed.
- name: Sections
  description: Physical zones within a venue (e.g. North Stand, VIP), used for the
    section heatmap.
- name: Posts
  description: 140-character venue feed posts, with upvotes, flags, and moderation.
- name: Comments
  description: Threaded replies on posts.
- name: Location Conversations
  description: Map-pin chat scoped to (venue, Mappedin location id), separate from
    the venue-wide post feed and from admin Sections.
- name: Notifications
  description: Per-user notification inbox, also pushed live over WebSocket.
- name: Admin
  description: Administrative metrics, moderation controls, and user management.
