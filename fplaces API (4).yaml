        upvotes_count:
          type: integer
          readOnly: true
        flags_count:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        has_upvoted:
          type: boolean
          readOnly: true
          description: Whether the requesting user has currently upvoted this post.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - content
      - created_at
      - flags_count
      - has_upvoted
      - id
      - status
      - updated_at
      - upvotes_count
      - user
      - venue
    PostFlagRequestRequest:
      type: object
      properties:
        reason:
          type: string
          description: Optional free-text reason for the flag, shown to moderators.
          maxLength: 255
    PostRequest:
      type: object
      properties:
        venue:
          type: integer
          description: The venue this post belongs to. Required.
        section:
          type: integer
          nullable: true
          description: Optional physical section within the venue (e.g. North Stand).
            Drives the live section heatmap when set.
        category:
          type: integer
          description: One of the fixed post categories (see /api/forum/categories/).
        content:
          type: string
          minLength: 1
          description: Post text, max 140 characters.
          maxLength: 140
      required:
      - category
      - content
      - venue
    PublicUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        display_name:
