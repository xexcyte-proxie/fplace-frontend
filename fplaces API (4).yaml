        name:
          type: string
          minLength: 1
          description: e.g. 'North Stand', 'VIP'. Unique per venue.
          maxLength: 50
        code:
          type: string
          description: Optional short code for the section, e.g. a gate/seat-map label.
          maxLength: 20
        is_active:
          type: boolean
          description: Toggle off to temporarily close a section (e.g. for an event)
            without archiving its post history.
    PatchedUserRequest:
      type: object
      properties:
        pseudo_name:
          type: string
          nullable: true
          description: Public display name shown on posts/comments instead of the
            user's real email. Must be unique. Set this during onboarding, after email
            verification and before selecting a venue.
          maxLength: 50
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        bio:
          type: string
        avatar_url:
          type: string
          format: uri
          nullable: true
          maxLength: 1024
        interests:
          type: array
          items:
            type: string
            minLength: 1
          nullable: true
          description: List of user interests.
    PatchedVenueRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Display name, must be unique.
          maxLength: 100
        location:
          type: string
          description: Free-text address/location.
          maxLength: 255
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
          description: Reserved for future GPS auto-suggest.
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
          description: Reserved for future GPS auto-suggest.
        mappedin_map_id:
          type: string
          nullable: true
          description: External key for Mappedin integration.
          maxLength: 255
        notes:
          type: string
    Post:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/PublicUser'
          readOnly: true
        venue:
          type: integer
          description: The venue this post belongs to. Required.
        section:
          type: integer
          nullable: true
          description: Optional physical section within the venue (e.g. North Stand).
