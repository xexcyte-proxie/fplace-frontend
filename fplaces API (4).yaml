          maxLength: 500
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content
      - created_at
      - id
      - location_id
      - location_name
      - updated_at
      - user
      - venue
    LocationMessageCreateRequest:
      type: object
      description: |-
        Input-only shape for `POST /api/forum/conversations/`. `venue`/`location_id`/
        `location_name` belong to the conversation (channel), not the message, so this isn't
        a ModelSerializer over either model — the view resolves the channel (find-or-create)
        before building the actual `LocationMessage` row.
      properties:
        venue:
          type: integer
          description: Venue id. Must exist (and not be archived) or a 404 is raised.
        location_id:
          type: string
          minLength: 1
          description: Opaque Mappedin location/place id, exact match. Never slugified
            or rewritten.
          maxLength: 255
        location_name:
          type: string
          default: ''
          description: Display name for the conversation. Only used on first create
            (or to backfill a currently-blank name); ignored once the conversation
            already has one.
          maxLength: 100
        content:
          type: string
          minLength: 1
          description: Message text, 1-500 characters.
          maxLength: 500
      required:
      - content
      - location_id
      - venue
    LocationMessageRequest:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          description: Message text, max 500 characters.
          maxLength: 500
      required:
      - content
