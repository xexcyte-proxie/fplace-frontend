  /api/users/guest/:
    post:
      operationId: users_guest_create
      description: |-
        Accepts an `ip_address` and `device_fingerprint` and returns a short-lived guest JWT (lifetime controlled by `GUEST_TOKEN_EXPIRATION_MINUTES`, default 60 min) together with the MappedIn API keys needed to render the map.

        The guest trial window is valid for the **same calendar day** of the first call for a given `device_fingerprint`. Subsequent calls on the same day re-issue a fresh JWT. If accessed on a subsequent day, the server returns `403`.

        The returned `access` token can be used as `Authorization: Bearer <token>` on any endpoint that accepts `IsAuthenticatedOrGuest` permission. The token carries `token_type=guest` in its payload.
      summary: Obtain a guest access token
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestAccessRequest'
            examples:
              GuestAccessRequest:
                value:
                  ip_address: 1.2.3.4
                  device_fingerprint: fp_abc123xyz
                summary: Guest access request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GuestAccessRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GuestAccessRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestAccessResponse'
              examples:
                GuestAccessResponse:
                  value:
                    access: eyJhbGciOiJIUzI1NiIs...
                    token_type: guest
                    expires_in: 3600
                    trial_expires_at: '2026-08-11T21:17:00Z'
                    has_tried_ar_view: false
                    has_tried_2d_view: false
                    has_2d_trial_expired: false
                    mappedin:
                      token: <mappedin-access-token>
                      expires_in: 3600
                  summary: Guest access response
          description: Guest token and MappedIn credentials issued.
        '403':
          description: Guest trial period has expired.
        '400':
          description: Validation error.
        '502':
          description: Failed to retrieve MappedIn token.
