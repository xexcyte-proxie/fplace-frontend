              schema:
                $ref: '#/components/schemas/LocationMessage'
          description: ''
  /api/forum/conversations/{id}/restore/:
    post:
      operationId: forum_conversations_restore_create
      description: Un-archives a record previously removed via `DELETE`, setting `is_archived`
        back to `False` so it reappears in normal list/retrieve queries.
      summary: Restore an archived location message
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this location message.
        required: true
      tags:
      - Location Conversations
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationMessage'
          description: ''
  /api/notifications/:
    get:
      operationId: notifications_list
      description: Returns the authenticated user's notifications, newest first. The
        same events are also pushed live over the `ws/notifications/` WebSocket as
        they're created, so clients typically combine an initial fetch here with live
        updates from the socket rather than polling.
      summary: List my notifications
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Notifications
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
  /api/notifications/mark_all_read/:
    post:
      operationId: notifications_mark_all_read_create
      summary: Mark all my notifications as read
      tags:
      - Notifications
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/notifications/unread_count/:
    get:
      operationId: notifications_unread_count_retrieve
      description: Lightweight count endpoint for rendering a notification badge without
        paginating through the full list.
      summary: Get my unread notification count
      tags:
      - Notifications
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
          description: ''
  /api/notifications/{id}/:
    get:
      operationId: notifications_retrieve
      summary: Retrieve a single notification
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this notification.
        required: true
      tags:
      - Notifications
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
  /api/notifications/{id}/mark_read/:
    post:
      operationId: notifications_mark_read_create
      summary: Mark one notification as read
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this notification.
        required: true
      tags:
      - Notifications
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
  /api/maps/token/:
    get:
      operationId: maps_token_retrieve
      tags:
      - Maps
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
components:
  schemas:
    AdminNotificationRequestRequest:
      type: object
      properties:
        subject:
          type: string
          minLength: 1
          description: Subject of the notification (required, especially for email
            templates).
          maxLength: 100
        message:
          type: string
          minLength: 1
          description: Body content of the notification.
          maxLength: 1000
        channels:
          type: array
          items:
            $ref: '#/components/schemas/ChannelsEnum'
          description: Delivery channels (email, push, or both).
        venue:
          type: integer
          nullable: true
          description: Filter users by venue they have posted in.
        section:
          type: integer
          nullable: true
          description: Filter users by section they have posted in.
        category:
          type: integer
          nullable: true
          description: Filter users by category they have posted in.
        users:
          type: array
          items:
            type: integer
          description: List of specific user IDs to notify.
      required:
      - channels
      - message
      - subject
    AdminNotificationResponse:
      type: object
      properties:
        detail:
          type: string
        users_targeted:
          type: integer
        email_sent:
          type: integer
        push_sent:
          type: integer
      required:
      - detail
      - email_sent
      - push_sent
      - users_targeted
    AdminPost:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          description: The post's author. Writable here (unlike the public PostSerializer)
            so admins can create/reassign posts on a user's behalf.
        user_detail:
          allOf:
          - $ref: '#/components/schemas/PublicUser'
          readOnly: true
        venue:
          type: integer
          description: The venue this post belongs to.
        venue_name:
          type: string
          readOnly: true
        section:
          type: integer
          nullable: true
          description: Optional section within the venue.
        section_name:
          type: string
          readOnly: true
        category:
          type: integer
          description: One of the fixed post categories.
        category_name:
          type: string
          readOnly: true
        content:
          type: string
          maxLength: 140
        upvotes_count:
          type: integer
          readOnly: true
        flags_count:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          description: |-
            `visible` or `hidden`. Prefer the `hide`/`show` actions over editing this directly so the `post_hidden` WebSocket event fires.

            * `visible` - Visible
            * `hidden` - Hidden
        is_archived:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - category_name
      - content
      - created_at
      - flags_count
      - id
      - section_name
      - updated_at
      - upvotes_count
      - user
      - user_detail
      - venue
      - venue_name
    AdminPostRequest:
      type: object
      properties:
        user:
          type: integer
          description: The post's author. Writable here (unlike the public PostSerializer)
            so admins can create/reassign posts on a user's behalf.
        venue:
          type: integer
          description: The venue this post belongs to.
        section:
          type: integer
          nullable: true
          description: Optional section within the venue.
        category:
          type: integer
          description: One of the fixed post categories.
        content:
          type: string
          minLength: 1
          maxLength: 140
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          description: |-
            `visible` or `hidden`. Prefer the `hide`/`show` actions over editing this directly so the `post_hidden` WebSocket event fires.

            * `visible` - Visible
            * `hidden` - Hidden
        is_archived:
          type: boolean
      required:
      - category
      - content
      - user
      - venue
    AdminStats:
      type: object
      properties:
        total_users:
          type: integer
        verified_users:
          type: integer
        total_posts:
          type: integer
        total_comments:
          type: integer
        flagged_posts_count:
          type: integer
        active_venues_count:
          type: integer
        posts_by_category:
          type: array
          items:
            $ref: '#/components/schemas/CategoryStat'
        posts_by_venue:
          type: array
          items:
            $ref: '#/components/schemas/VenueStat'
      required:
      - active_venues_count
      - flagged_posts_count
      - posts_by_category
      - posts_by_venue
      - total_comments
      - total_posts
      - total_users
      - verified_users
    AdminUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        pseudo_name:
          type: string
          nullable: true
          maxLength: 50
        is_email_verified:
          type: boolean
        is_staff:
          type: boolean
        is_active:
          type: boolean
        is_archived:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - email
      - id
      - last_login
    AdminUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        pseudo_name:
          type: string
          nullable: true
          maxLength: 50
        is_email_verified:
          type: boolean
        is_staff:
          type: boolean
        is_active:
          type: boolean
        is_archived:
          type: boolean
      required:
      - email
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Display name, must be unique.
          maxLength: 50
        slug:
          type: string
          readOnly: true
          description: Auto-derived from `name` if not provided.
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          description: Short explanation shown under the category in pickers.
          maxLength: 255
        disclaimer:
          type: string
          description: Optional warning shown when this category is selected, e.g.
            the Help category's medical/security disclaimer.
          maxLength: 255
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Sort order in category pickers, ascending.
        is_active:
          type: boolean
          description: Toggle off to hide from new-post pickers without affecting
            existing posts.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - slug
      - updated_at
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Display name, must be unique.
          maxLength: 50
        description:
          type: string
          description: Short explanation shown under the category in pickers.
          maxLength: 255
        disclaimer:
          type: string
          description: Optional warning shown when this category is selected, e.g.
            the Help category's medical/security disclaimer.
          maxLength: 255
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Sort order in category pickers, ascending.
        is_active:
          type: boolean
          description: Toggle off to hide from new-post pickers without affecting
            existing posts.
      required:
      - name
    CategoryStat:
      type: object
