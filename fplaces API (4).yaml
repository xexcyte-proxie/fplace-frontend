          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Section'
    PaginatedVenueList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Venue'
    PasswordResetConfirmRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
          description: Base64url-encoded user id, taken from the `uid` query param
            in the password reset link sent by email.
        token:
          type: string
          minLength: 1
          description: Reset token from the `token` query param in the password reset
            link.
        new_password:
          type: string
          writeOnly: true
          minLength: 1
          description: Must pass Django's password validators.
      required:
      - new_password
      - token
      - uid
    PasswordResetRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          description: Account email to send a password reset link to. Always returns
            200 whether or not the account exists, to avoid leaking which emails are
            registered.
      required:
      - email
    PatchedAdminPostRequest:
      type: object
      properties:
        user:
          type: integer
          description: The post's author. Writable here (unlike the public PostSerializer)
            so admins can create/reassign posts on a user's behalf.
        venue:
          type: integer
          description: The venue this post belongs to.
        section:
          type: integer
          nullable: true
          description: Optional section within the venue.
        category:
          type: integer
          description: One of the fixed post categories.
        content:
          type: string
          minLength: 1
          maxLength: 140
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          description: |-
            `visible` or `hidden`. Prefer the `hide`/`show` actions over editing this directly so the `post_hidden` WebSocket event fires.

            * `visible` - Visible
            * `hidden` - Hidden
        is_archived:
          type: boolean
    PatchedAdminUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        pseudo_name:
          type: string
          nullable: true
          maxLength: 50
        is_email_verified:
          type: boolean
        is_staff:
          type: boolean
        is_active:
          type: boolean
        is_archived:
          type: boolean
    PatchedCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Display name, must be unique.
          maxLength: 50
        description:
          type: string
          description: Short explanation shown under the category in pickers.
          maxLength: 255
        disclaimer:
          type: string
          description: Optional warning shown when this category is selected, e.g.
            the Help category's medical/security disclaimer.
          maxLength: 255
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Sort order in category pickers, ascending.
        is_active:
          type: boolean
          description: Toggle off to hide from new-post pickers without affecting
            existing posts.
    PatchedCommentRequest:
      type: object
      properties:
        post:
          type: integer
          description: The post this comment replies to.
        content:
          type: string
          minLength: 1
          description: Comment text, max 500 characters.
          maxLength: 500
    PatchedGuestSessionUpdateRequestRequest:
      type: object
      properties:
        has_tried_ar_view:
          type: boolean
        has_tried_2d_view:
          type: boolean
    PatchedInterestRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Display name, must be unique.
          maxLength: 50
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Sort order in interest pickers, ascending.
        is_active:
          type: boolean
          description: Toggle off to hide from interest pickers without affecting
            users who already selected it.
    PatchedLocationMessageRequest:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          description: Message text, max 500 characters.
          maxLength: 500
    PatchedPostRequest:
      type: object
      properties:
        venue:
          type: integer
          description: The venue this post belongs to. Required.
        section:
          type: integer
          nullable: true
          description: Optional physical section within the venue (e.g. North Stand).
            Drives the live section heatmap when set.
        category:
          type: integer
          description: One of the fixed post categories (see /api/forum/categories/).
        content:
          type: string
          minLength: 1
          description: Post text, max 140 characters.
          maxLength: 140
    PatchedSectionRequest:
      type: object
      properties:
        venue:
          type: integer
