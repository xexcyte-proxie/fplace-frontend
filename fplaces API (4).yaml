          type: integer
          readOnly: true
          nullable: true
          description: The related post, if this notification is post-related.
        comment:
          type: integer
          readOnly: true
          nullable: true
          description: The related comment, if this notification is comment-related.
        message:
          type: string
          readOnly: true
          description: Human-readable summary, ready to display as-is.
        is_read:
          type: boolean
          description: Set via `POST /{id}/mark_read/` or `POST mark_all_read/`.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
