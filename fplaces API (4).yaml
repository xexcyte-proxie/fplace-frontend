openapi: 3.0.3
info:
  title: fplaces API
  version: 1.0.0
  description: "Real-time, venue-based social platform API.\n\nFans inside the same
    stadium/venue share a live feed tied to physical sections: posts, comments, upvotes,
    and flags, plus live crowd-sourced section heatmaps.\n\n## Authentication\nMost
    endpoints require a JWT access token. Obtain one via `POST /api/users/login/`,
    then send it as `Authorization: Bearer <access_token>`. Access tokens expire after
    30 minutes; use `POST /api/users/token/refresh/` with the refresh token to renew.\n\nWebSocket
    connections (venue rooms, location conversation rooms, personal notifications)
    authenticate via a `?token=<access_token>` query parameter instead of a header.\n\n##
    Error format\nAll error responses (validation, auth, permission, not-found, server
    errors) share a single envelope:\n\n```json\n{\n  \"status\": \"error\",\n  \"message\":
    \"Human-readable summary\",\n  \"details\": { \"field\": [\"...\"] }\n}\n```\n\n##
    Soft delete\nNothing is hard-deleted. `DELETE` on any resource archives it (`is_archived=True`)
    instead of removing the row; archived records are excluded from normal querysets.
    Most resources expose a `POST /{id}/restore/` action to bring them back.\n\n<br/><a
    href=\"/api/guide.html\" target=\"_blank\" style=\"display:inline-block; padding:10px
    20px; background-color:#00e096; color:#08090c; text-decoration:none; border-radius:8px;
    font-weight:bold;\">\U0001F4D6 View Frontend Integration Guide</a>"
  contact:
    name: fplaces
    email: support@fplaces.app
  license:
    name: Proprietary
paths:
  /api/admin/stats/:
    get:
      operationId: admin_stats_retrieve
      description: 'Aggregate counts for the admin dashboard: total/verified user
        counts, total posts/comments, how many posts currently have at least one flag
        (see `GET /api/admin/posts/flagged/` to review them), how many venues are
        active, plus a per-category and per-venue breakdown of post counts. Counts
        include archived/soft-deleted rows (uses `all_objects`), since this is an
        internal operational view, not a public-facing feed.'
      summary: Get system-wide dashboard stats
      tags:
      - Admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStats'
          description: ''
  /api/admin/users/:
    get:
      operationId: admin_users_list
      description: Unlike `users.objects` (which excludes archived users), this queries
        `User.all_objects` so moderators can see the complete picture, including unverified
        signups and previously archived accounts.
      summary: List all users (including archived/unverified)
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUserList'
          description: ''
    post:
      operationId: admin_users_create
      description: Creates a user with no usable password (`set_unusable_password()`)
        since this endpoint doesn't accept one — the account holder sets their own
        password via `POST /api/users/password-reset/` once notified. Mainly intended
        for seeding staff/admin accounts outside of self-service registration.
      summary: Create a user manually
      tags:
      - Admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/admin/users/{id}/:
    put:
      operationId: admin_users_update
      summary: Replace a user's admin-editable fields
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - Admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    get:
      operationId: admin_users_retrieve
      summary: Retrieve a single user's full admin details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - Admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    delete:
      operationId: admin_users_destroy
      description: Equivalent to `POST /{id}/archive/` — sets `is_archived=True` rather
        than permanently deleting the row, consistent with every other resource in
        this API. Use `POST /{id}/restore/` to undo.
      summary: Archive a user (soft delete)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - Admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
    patch:
      operationId: admin_users_partial_update
      summary: Update a user's admin-editable fields
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - Admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/admin/users/{id}/archive/:
    post:
      operationId: admin_users_archive_create
      description: Sets `is_archived=True` on the user so they can no longer log in
        (`UserManager.get_queryset` excludes archived users) and disappear from non-admin
        listings. Their posts/comments are untouched and remain visible.
      summary: Archive a user (soft delete)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - Admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/admin/users/{id}/restore/:
    post:
      operationId: admin_users_restore_create
      description: Reverses `archive`, setting `is_archived=False` so the user can
        log in again and reappears in non-admin listings.
      summary: Restore an archived user
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - Admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/admin/users/{id}/toggle-staff/:
    post:
      operationId: admin_users_toggle_staff_create
      description: Flips `is_staff` to its opposite value, granting or revoking Django
        admin + this Admin API's access in one call. There's no separate grant/revoke
        endpoint — call this again to toggle back.
      summary: Toggle a user's staff status
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - Admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/admin/posts/:
    get:
      operationId: admin_posts_list
      description: Queries `Post.all_objects`, unlike the public `PostViewSet` (which
        excludes archived posts and hides `status=hidden` posts from non-staff). Use
        this for full moderation visibility, or `GET /flagged/` to focus specifically
        on posts awaiting review.
      summary: List all posts (including hidden/archived)
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminPostList'
          description: ''
    post:
      operationId: admin_posts_create
      description: Unlike the public `PostViewSet.create` (which always sets `user`
        from the authenticated requester), `user` is a writable field here so admins
        can create posts attributed to any account, e.g. for seeding demo content.
      summary: Create a post on a user's behalf
      tags:
      - Admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPostRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminPostRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminPostRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPost'
          description: ''
  /api/admin/posts/flagged/:
    get:
      operationId: admin_posts_flagged_list
      description: Returns posts with `flags_count > 0`, sorted by flag count descending
        (most-flagged first), then newest first. This is the moderation queue — review
        each post and either `POST /{id}/clear-flags/` once resolved, or `POST /{id}/hide/`
        to remove it from public feeds.
      summary: List posts flagged for moderation
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminPostList'
          description: ''
  /api/admin/posts/{id}/:
    put:
      operationId: admin_posts_update
      summary: Replace a post's admin-editable fields
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this post.
        required: true
      tags:
      - Admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPostRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminPostRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminPostRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPost'
          description: ''
    get:
      operationId: admin_posts_retrieve
      summary: Retrieve a single post's full admin details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this post.
        required: true
      tags:
      - Admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPost'
          description: ''
    delete:
      operationId: admin_posts_destroy
      description: Sets `is_archived=True` rather than permanently deleting the row.
        Use `POST /{id}/restore/` to undo.
      summary: Archive a post (soft delete)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this post.
        required: true
      tags:
      - Admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
    patch:
      operationId: admin_posts_partial_update
      summary: Update a post's admin-editable fields
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this post.
        required: true
      tags:
      - Admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminPostRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminPostRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminPostRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPost'
          description: ''
  /api/admin/posts/{id}/clear-flags/:
    post:
      operationId: admin_posts_clear_flags_create
      description: Resets `flags_count` to `0` and soft-archives every active `PostFlag`
        row for this post (preserving them for audit history rather than deleting).
        Use once a moderator has reviewed a flagged post and decided it doesn't need
        hiding.
      summary: Clear all flags on a post
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this post.
        required: true
      tags:
      - Admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPost'
          description: ''
  /api/admin/posts/{id}/hide/:
    post:
      operationId: admin_posts_hide_create
      description: Sets `status=hidden`, removing the post from non-staff feeds (it's
        a moderation state, not a soft-delete — the row stays active). Broadcasts
        a `post_hidden` event to the venue's WebSocket room so clients currently viewing
        the feed remove it immediately. Equivalent to the public `PostViewSet`'s own
        `hide` action, exposed here for the admin dashboard's moderation queue workflow.
      summary: Hide a post (moderation)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this post.
        required: true
      tags:
      - Admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPost'
          description: ''
  /api/admin/posts/{id}/restore/:
    post:
      operationId: admin_posts_restore_create
      description: Reverses soft-delete, setting `is_archived=False` so the post reappears
        in normal queries.
      summary: Restore an archived post
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this post.
        required: true
      tags:
      - Admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPost'
          description: ''
  /api/admin/posts/{id}/show/:
    post:
      operationId: admin_posts_show_create
      description: Reverses `hide`, setting `status=visible` so the post reappears
        in non-staff feeds.
      summary: Un-hide a post (moderation)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this post.
        required: true
      tags:
      - Admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPost'
          description: ''
  /api/admin/notifications/:
    post:
      operationId: admin_notifications_create
      description: |-
        Sends an email, an in-app push (a `Notification` row with `verb=broadcast`, delivered live over `ws/notifications/`), or both, to active users matched by **any** of `venue`/`section`/`category` (users who have posted there) or explicit `users` ids — a union, not an intersection. At least one filter is required.

        Delivery is best-effort per user/channel: a failure sending to one user (e.g. a bad email address) is swallowed and doesn't stop the rest of the broadcast; the response reports how many sends actually succeeded via `email_sent`/`push_sent` versus how many users were matched (`users_targeted`).
      summary: Broadcast an admin notification to targeted users
      tags:
      - Admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminNotificationRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminNotificationRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminNotificationRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNotificationResponse'
          description: ''
  /api/users/register/:
    post:
      operationId: users_register_create
      description: |-
        Creates a new user with `email` + `password` and immediately sends a verification email (see `POST /api/users/verify-email/`).

        The account is created with `is_email_verified=False` and no `pseudo_name`. Per the onboarding flow, the client should prompt the user to verify their email and then set a `pseudo_name` via `PATCH /api/users/me/` before letting them select a venue and post.
      summary: Register a new account
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              RegisterRequest:
                value:
                  email: fan@example.com
                  password: SuperSecret123!
                  password_confirm: SuperSecret123!
                summary: Register request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                RegisterResponse:
                  value:
                    id: 1
                    email: fan@example.com
                    pseudo_name: null
                    is_email_verified: false
                    created_at: '2026-06-19T00:04:56.813191Z'
                    updated_at: '2026-06-19T00:04:56.813210Z'
                  summary: Register response
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/users/verify-email/:
    post:
      operationId: users_verify_email_create
      description: Confirms the `email`/`otp` sent on registration (or resent via
        `POST /api/users/resend-verification/`), and sets `is_email_verified=True`
        on the matching account.
      summary: Verify an email address
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/users/resend-verification/:
    post:
      operationId: users_resend_verification_create
      description: Re-sends the verification email for an account that hasn't verified
        yet. Always returns `200` with a generic message, regardless of whether the
        email exists or is already verified, to avoid leaking account existence.
      summary: Resend the verification email
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/users/login/:
    post:
      operationId: users_login_create
      description: |-
        Authenticates with `email` + `password` and returns an `access` token (send as `Authorization: Bearer <access>` on subsequent requests, expires after 30 minutes) and a `refresh` token (expires after 14 days, used with `POST /api/users/token/refresh/` to obtain a new access token, or `POST /api/users/logout/` to invalidate it).

        The response also embeds the authenticated user's profile under `user`, so the client doesn't need a separate `GET /api/users/me/` call right after login.
      summary: Log in and obtain a JWT pair
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPairRequest'
            examples:
              LoginRequest:
                value:
                  email: fan@example.com
                  password: SuperSecret123!
                summary: Login request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPairRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/users/login/google/:
    post:
      operationId: users_login_google_create
      description: Validates the provided Google `id_token`. If the email is new,
        creates an account and marks it verified. Returns a standard JWT pair and
        the user profile.
      summary: Log in via Google
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/users/token/refresh/:
    post:
      operationId: users_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/users/logout/:
