        token_type:
          type: string
        expires_in:
          type: integer
        trial_expires_at:
          type: string
          format: date-time
        has_tried_ar_view:
          type: boolean
        has_tried_2d_view:
          type: boolean
        has_2d_trial_expired:
          type: boolean
        mappedin:
          $ref: '#/components/schemas/GuestMappedInData'
