      - posts_count
      - upvotes_count
      - venues_count
    UserTypeEnum:
      enum:
      - regular_user
      - admin
      type: string
      description: |-
        * `regular_user` - Regular User
        * `admin` - Admin
    Venue:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
