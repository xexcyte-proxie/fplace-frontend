            registered.
      required:
      - email
    Section:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        venue:
          type: integer
          description: The venue this section belongs to.
        name:
          type: string
          description: e.g. 'North Stand', 'VIP'. Unique per venue.
          maxLength: 50
        code:
          type: string
          description: Optional short code for the section, e.g. a gate/seat-map label.
          maxLength: 20
        is_active:
          type: boolean
          description: Toggle off to temporarily close a section (e.g. for an event)
            without archiving its post history.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
      - venue
    SectionRequest:
      type: object
      properties:
        venue:
          type: integer
          description: The venue this section belongs to.
        name:
          type: string
          minLength: 1
          description: e.g. 'North Stand', 'VIP'. Unique per venue.
          maxLength: 50
        code:
          type: string
          description: Optional short code for the section, e.g. a gate/seat-map label.
          maxLength: 20
        is_active:
          type: boolean
          description: Toggle off to temporarily close a section (e.g. for an event)
            without archiving its post history.
      required:
      - name
      - venue
    StatusEnum:
      enum:
      - visible
      - hidden
      type: string
      description: |-
        * `visible` - Visible
        * `hidden` - Hidden
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    UnreadCount:
      type: object
      properties:
        unread_count:
          type: integer
      required:
      - unread_count
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        pseudo_name:
          type: string
          nullable: true
          description: Public display name shown on posts/comments instead of the
            user's real email. Must be unique. Set this during onboarding, after email
            verification and before selecting a venue.
          maxLength: 50
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        bio:
          type: string
        avatar_url:
          type: string
          format: uri
          nullable: true
          maxLength: 1024
        user_type:
          allOf:
          - $ref: '#/components/schemas/UserTypeEnum'
          readOnly: true
        is_email_verified:
          type: boolean
          readOnly: true
        interests:
          type: array
          items:
            type: string
          nullable: true
          description: List of user interests.
        stat:
          allOf:
          - $ref: '#/components/schemas/UserStat'
          readOnly: true
          description: 'Aggregate profile stats: `posts_count` (posts authored), `upvotes_count`
            (upvotes received across those posts), and `venues_count` (distinct venues
            posted in).'
        recent_posts:
          type: array
          items: {}
          readOnly: true
          description: The user's 5 most recently created posts, newest first.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - id
      - is_email_verified
      - recent_posts
      - stat
      - updated_at
      - user_type
    UserRequest:
      type: object
      properties:
        pseudo_name:
          type: string
          nullable: true
          description: Public display name shown on posts/comments instead of the
            user's real email. Must be unique. Set this during onboarding, after email
            verification and before selecting a venue.
          maxLength: 50
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        bio:
          type: string
        avatar_url:
          type: string
          format: uri
          nullable: true
          maxLength: 1024
        interests:
          type: array
          items:
            type: string
            minLength: 1
          nullable: true
          description: List of user interests.
    UserStat:
      type: object
      properties:
        posts_count:
          type: integer
          description: Number of posts authored
        upvotes_count:
          type: integer
          description: Total upvotes received across posts
        venues_count:
          type: integer
          description: Distinct venues posted in
