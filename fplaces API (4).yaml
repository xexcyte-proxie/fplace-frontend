          type: string
          minLength: 6
          description: The 6-digit One-Time Password sent to your email.
          maxLength: 6
      required:
      - email
      - otp
    GoogleLoginRequest:
      type: object
      properties:
        id_token:
          type: string
          minLength: 1
          description: The ID token returned by Google's OAuth2 frontend SDK.
      required:
      - id_token
    GuestAccessRequest:
      type: object
      properties:
        ip_address:
          type: string
          minLength: 1
          description: The guest's current IP address.
        device_fingerprint:
          type: string
          minLength: 1
          description: An opaque, client-generated string that uniquely identifies
            this device (e.g. a hash of browser/hardware attributes). The same fingerprint
            across requests ties activity to one trial window.
          maxLength: 512
      required:
      - device_fingerprint
      - ip_address
    GuestAccessResponse:
      type: object
      properties:
        access:
