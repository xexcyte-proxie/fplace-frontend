<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta http-equiv="Permissions-Policy" content="camera=(self), geolocation=(self)" />
    <title>Fplaces AR Navigation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/ar.css" />
  </head>
  <body>
    <video id="camera" autoplay playsinline muted></video>

    <div id="hud">
      <div class="status-pill" id="status">Open AR from the map after generating a route.</div>

      <div id="live-nav" class="live-nav hidden">
        <div class="turn-row">
          <div id="then-chip" class="then-chip hidden">
            <span class="then-label">Then</span>
            <span id="then-icon"></span>
            <span id="then-text" class="then-text"></span>
          </div>
          <div class="primary-turn">
            <span id="turn-icon"></span>
            <span id="turn-text">Follow route</span>
          </div>
        </div>
        <div id="distance-bar" class="distance-bar"></div>
      </div>

      <div id="trip-footer" class="trip-footer hidden">
        <div class="trip-dest">
          <span class="trip-dest-label">Destination</span>
          <span id="trip-dest">—</span>
        </div>
        <div class="trip-stat">
          <span id="trip-dist">—</span>
          <small>left</small>
        </div>
      </div>

      <div id="offPath" class="warn-banner hidden"></div>

      <div id="floor-banner" class="floor-banner hidden">
        <span class="material-symbols-rounded" aria-hidden="true">layers</span>
        <span id="floor-banner-text"></span>
      </div>

      <div id="align-banner" class="align-banner hidden">
        <span class="material-symbols-rounded" aria-hidden="true">screen_rotation</span>
        <span id="align-text">Point your phone toward the path</span>
      </div>

      <div id="hero-distance" class="hero-distance hidden">
        <span id="hero-distance-value">—</span>
        <span id="hero-distance-unit">m</span>
      </div>

      <div id="arrival-card" class="arrival-card hidden">
        <span class="material-symbols-rounded arrival-icon" aria-hidden="true">check_circle</span>
        <div class="arrival-copy">
          <div class="arrival-title">You've arrived</div>
          <div id="arrival-dest" class="arrival-dest"></div>
        </div>
      </div>
    </div>

    <script src="./config.js"></script>
    <script src="./js/ar-debug.js"></script>
    <script src="./js/route-bridge.js"></script>
    <script src="./js/anchorEngine.js"></script>
    <script src="./js/route-geometry.js"></script>
    <script src="./js/indoor-position.js"></script>
    <script src="./js/pathGeometry.js"></script>
    <script src="./js/world-route-scene.js"></script>
    <script src="./js/demo-sim-walk.js"></script>
    <script src="./js/route-navigator.js"></script>
    <script src="./js/route-lane-heading.js"></script>
    <script src="./js/live-view-hud.js"></script>
    <script src="./js/live-view-arrows-3d.js"></script>
    <script src="./js/orientation-compass.js"></script>
    <script src="./js/live-view-minimap.js"></script>
    <script src="./js/fallback-nav.js"></script>
    <script id="xr-bootstrap"></script>
    <script src="./js/xr-nav-scene.js"></script>
    <script src="./js/bootstrap.js"></script>
  </body>
</html>
