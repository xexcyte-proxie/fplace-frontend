<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta http-equiv="Permissions-Policy" content="camera=(self), geolocation=(self)" />
    <!-- XR Engine: Niantic Spatial, Inc. https://github.com/8thwall/engine/blob/main/LICENSE -->
    <title>Fplaces AR Navigation</title>
    <link rel="stylesheet" href="./css/ar.css" />
  </head>
  <body>
    <video id="camera" autoplay playsinline muted></video>
    <div id="hud">
      <div class="banner" id="status">Open AR from the map after generating a route.</div>
      <div class="hud-bottom">
        <div class="instruction" id="instruction">—</div>
        <div class="meta" id="meta"></div>
        <div class="meta warn" id="offPath"></div>
      </div>
    </div>

    <script src="./config.js"></script>
    <script src="./js/route-bridge.js"></script>
    <script src="./js/route-navigator.js"></script>
    <script src="./js/fallback-nav.js"></script>

    <!-- Loaded only when 8th Wall app key is configured -->
    <script id="xr-bootstrap"></script>
    <script src="./js/xr-nav-scene.js"></script>
    <script src="./js/bootstrap.js"></script>
  </body>
</html>
